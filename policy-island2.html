<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>政策島 · Policy Island</title>
<style>
*{box-sizing:border-box}
:root{
  --coral:#db6a41; --ink:#211d1d; --cream:#fff8f4; --yellow:#fcea8b;
  --stone:#c5b5a7; --green:#71806a;
  --glass:rgba(255,250,244,.76);
  --line:rgba(74,42,20,.12);
  --shadow:0 18px 46px rgba(74,42,20,.16),0 3px 10px rgba(74,42,20,.08);
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(ellipse at 50% 32%,#fffdf9 0%,#f7eee2 52%,#edddcf 100%);font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased}
body{overscroll-behavior:none;touch-action:none}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%}
#labels{position:fixed;inset:0;pointer-events:none;z-index:6}
button{font-family:var(--font);border:0;cursor:pointer;background:transparent;color:inherit;min-height:44px;border-radius:9px;transition:background .16s ease,color .16s ease,transform .16s ease}
button:hover{background:var(--yellow)}
button:active{background:var(--ink);color:var(--cream)}
button:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
input{font-family:var(--font)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(74,42,20,.18);border-radius:99px}
::-webkit-scrollbar-track{background:transparent}

.glass{background:var(--glass);backdrop-filter:blur(18px) saturate(1.15);-webkit-backdrop-filter:blur(18px) saturate(1.15);border:1px solid rgba(255,255,255,.7);box-shadow:var(--shadow)}

#brand{position:fixed;left:16px;top:16px;z-index:20;padding:12px 18px 12px 16px;border-radius:18px;display:flex;align-items:center;gap:12px}
#brand .mark{width:40px;height:40px;border-radius:12px;background:linear-gradient(150deg,#db6a41,#f0a06c);display:grid;place-items:center;color:#fff;font-weight:800;font-size:18px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
#brand h1{margin:0;font-size:19px;letter-spacing:.5px;line-height:1.1;font-weight:800}
#brand h1 em{font-style:normal;color:var(--coral);margin-left:6px;font-size:13px;letter-spacing:2px;font-weight:700}
#brand p{margin:3px 0 0;font-size:10px;letter-spacing:2.2px;text-transform:uppercase;color:#7a6a5c;font-family:var(--mono);font-weight:700}

#toolLeft{position:fixed;left:16px;top:92px;z-index:20;display:flex;gap:6px;padding:6px;border-radius:14px}
#toolLeft button{width:44px;min-height:44px;display:grid;place-items:center;font-size:16px;border-radius:9px;color:#4b3a2d}
#toolLeft button.on{background:rgba(219,106,65,.14);color:var(--coral)}
#toolLeft .ico{display:block;font-size:17px;line-height:1}

.eyebrow{font-family:var(--mono);font-weight:700;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#8a7868}
</style>
<style>
/* ---------- left detail panel ---------- */
#panel{position:fixed;left:16px;top:150px;width:340px;max-height:calc(100vh - 250px);z-index:18;border-radius:22px;overflow:hidden;display:none;flex-direction:column}
#panel.show{display:flex}
#panel .cardTop{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px 0}
#panel .close{width:34px;min-height:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:16px;background:rgba(255,255,255,.7);color:#6b5a4c}
#panel .cardScroll{overflow-y:auto;padding:2px 18px 18px}
#panel h2{margin:4px 0 6px;font-size:24px;line-height:1.18;letter-spacing:-.3px}
#panel h3{margin:16px 0 8px;font-size:10px;font-family:var(--mono);font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#8a7868}
#panel p.lead{margin:0 0 12px;font-size:13px;line-height:1.7;color:#5b4a3d}
#panel .summary{font-size:13.5px;line-height:1.75;color:#5b4a3d;margin:0 0 14px}
#panel .thumbWrap{position:relative;border-radius:16px;overflow:hidden;background:linear-gradient(160deg,#fdf6ec,#f2e2d2);border:1px solid rgba(255,255,255,.9);height:150px;display:grid;place-items:center;margin:2px 0 12px}
#panel .thumbWrap img{width:150px;height:150px;display:block}
#panel .thumbWrap .lbl{position:absolute;left:10px;bottom:8px;font-family:var(--mono);font-size:9px;letter-spacing:1.6px;color:#9a8878;font-weight:700}
#panel .facts{display:flex;gap:8px;margin:0 0 6px}
#panel .fact{flex:1;background:rgba(255,255,255,.78);border:1px solid rgba(255,255,255,.9);border-radius:13px;padding:9px 8px;text-align:center;box-shadow:0 3px 10px #4a2a1410;min-width:0}
#panel .fact b{display:block;font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:23px;line-height:1;color:var(--coral);letter-spacing:-.5px}
#panel .fact span{display:block;font-size:9.5px;color:#7d6b5c;margin-top:4px;line-height:1.3}
#panel .tl{position:relative;margin:6px 0 4px;padding-top:16px}
#panel .tl .track{position:absolute;left:7px;right:7px;top:23px;height:3px;border-radius:3px;background:linear-gradient(90deg,#e2cdbb,#f0dcc9)}
#panel .tl .dots{display:flex;justify-content:space-between;position:relative}
#panel .tl .dot{text-align:center;width:34%;}
#panel .tl .dot i{display:block;width:15px;height:15px;border-radius:50%;margin:0 auto 7px;background:#fff;border:3px solid #e0cbb8}
#panel .tl .dot.now i{border-color:var(--coral);background:var(--coral);box-shadow:0 0 0 4px rgba(219,106,65,.16)}
#panel .tl .dot b{display:block;font-size:11px;font-weight:700}
#panel .tl .dot span{display:block;font-size:9.5px;color:#8a7868;margin-top:2px}
#panel .listRow{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:8px 9px;border-radius:11px;font-size:12.5px;min-height:40px;line-height:1.35;color:#3d2f24}
#panel .listRow:hover{background:rgba(252,234,139,.55)}
#panel .listRow b{flex:0 0 20px;height:20px;border-radius:50%;background:#f3e3d3;color:#8a6a52;font-size:10px;display:grid;place-items:center;font-weight:800}
#panel .listRow .mdl{margin-left:auto;font-family:var(--mono);font-size:8.5px;letter-spacing:1px;color:#a5958a;text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 10px;font-size:11px;background:#fff;box-shadow:0 2px 8px #4a2a1414;border:1px solid rgba(74,42,20,.06);color:#4d3c2f}
.chip.coral{background:rgba(219,106,65,.12);color:#a8482a}
.chip.ghost{background:rgba(255,255,255,.55)}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:12px;padding:7px 0;border-bottom:1px dashed rgba(74,42,20,.12)}
.kv:last-child{border-bottom:0}
.kv span{color:#8a7868}
.kv b{font-weight:700;text-align:right}
.bigRow{display:flex;align-items:baseline;gap:8px;margin:12px 0 2px}
.bigRow b{font-family:Georgia,serif;font-style:italic;font-size:38px;line-height:1;color:var(--coral)}
.bigRow span{font-size:12px;color:#7d6b5c}

/* ---------- right sidebar ---------- */
#sidebar{position:fixed;right:16px;top:228px;bottom:16px;width:318px;z-index:17;border-radius:20px;display:flex;flex-direction:column;overflow:hidden}
#sidebar .sHead{padding:12px 12px 8px}
#sidebar .searchWrap{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.9);border-radius:11px;padding:0 10px;height:40px;box-shadow:inset 0 1px 2px rgba(74,42,20,.05)}
#sidebar .searchWrap input{flex:1;border:0;background:transparent;outline:none;font-size:12.5px;color:var(--ink);height:38px}
#sidebar .searchWrap span{color:#a5958a;font-size:14px}
.tabs{display:flex;gap:5px;margin-top:9px;background:rgba(255,255,255,.5);padding:4px;border-radius:11px}
.tabs button{flex:1;min-height:34px;height:34px;border-radius:8px;font-size:11.5px;font-weight:700;color:#7d6b5c}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(74,42,20,.09)}
#listBody{flex:1;overflow-y:auto;padding:4px 10px 14px}
#sidebar details{border-radius:12px;margin:2px 0}
#sidebar details[open]{background:rgba(255,255,255,.52);box-shadow:inset 0 0 0 1px rgba(255,255,255,.8)}
#sidebar summary{list-style:none;display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:12px;cursor:pointer;min-height:44px;font-size:13px;font-weight:700;color:#3d2f24}
#sidebar summary::-webkit-details-marker{display:none}
#sidebar summary:hover{background:rgba(252,234,139,.45)}
#sidebar summary .num{font-family:var(--mono);font-size:9px;color:#a5958a;font-weight:700;letter-spacing:1px}
#sidebar summary .ico{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;font-size:13px;background:rgba(219,106,65,.12)}
#sidebar summary .cnt{margin-left:auto;font-size:9.5px;color:#a5958a;font-family:var(--mono);font-weight:700}
#sidebar .items{padding:0 6px 6px}
#sidebar .iRow{display:flex;align-items:flex-start;gap:7px;width:100%;text-align:left;padding:7px 8px;border-radius:8px;font-size:11.5px;line-height:1.45;min-height:34px;color:#5b4a3d}
#sidebar .iRow:hover{background:#fff}
#sidebar .iRow b{color:#b09a88;font-size:9px;font-family:var(--mono);min-width:12px;margin-top:2px}
#sidebar .fRow{width:100%;text-align:left;padding:9px 10px;border-radius:11px;display:block;min-height:44px}
#sidebar .fRow:hover{background:#fff}
#sidebar .fRow .fl{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:#3d2f24}
#sidebar .fRow .fl i{font-style:normal;color:var(--coral)}
#sidebar .fRow .sm{font-size:10.5px;color:#8a7868;margin-top:3px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ev{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:999px;font-size:9px;font-weight:700;letter-spacing:.4px}
.ev.official{background:rgba(88,166,166,.16);color:#2f7171}
.ev.thematic{background:rgba(111,127,181,.16);color:#4a5a94}
.ev.pending{background:rgba(197,181,167,.28);color:#7c6a5a}
#sidebar .empty{font-size:11.5px;color:#9a8878;padding:18px 10px;text-align:center;line-height:1.7}

/* ---------- HUD ---------- */
#hud{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:19;display:flex;align-items:stretch;gap:10px;padding:8px;border-radius:18px}
#hud .grp{display:flex;gap:3px;padding:3px;border-radius:13px;background:rgba(255,255,255,.45)}
#hud .grp>div{display:flex;gap:2px}
#hud button{width:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:9.5px;color:#6b5a4c;padding:4px 2px;min-height:46px;line-height:1.2;border-radius:9px}
#hud button .ico{font-size:15px;line-height:1}
#hud button.on{background:rgba(219,106,65,.15);color:#b4502c}
#hud .sep{width:1px;background:rgba(74,42,20,.1);margin:4px 2px}
#hud .tbtn{font-family:var(--mono);font-size:9.5px;letter-spacing:.5px;font-weight:700}
</style>
<style>
/* ---------- journal ---------- */
#journal{position:fixed;right:16px;top:16px;width:318px;max-height:196px;z-index:17;border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
#journal .jHead{display:flex;align-items:center;gap:7px;padding:10px 13px 7px;border-bottom:1px solid rgba(74,42,20,.08);flex-wrap:wrap}
#journal .jHead b{font-size:12px;letter-spacing:.4px}
#journal .live{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:8.5px;letter-spacing:1.4px;font-weight:700;color:#4d8a5c}
#journal .live i{width:6px;height:6px;border-radius:50%;background:#4dbb6a;box-shadow:0 0 0 3px rgba(77,187,106,.18);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.35}}
#journal .jfilters{display:flex;gap:4px;flex-wrap:wrap;padding:7px 10px 4px}
#journal .jfilters button{font-size:9px;padding:3px 8px;min-height:24px;height:24px;border-radius:999px;background:rgba(255,255,255,.7);color:#7d6b5c}
#journal .jfilters button.on{background:var(--ink);color:var(--cream)}
#journal .jlist{overflow-y:auto;padding:2px 8px 10px;flex:1}
#journal .jev{display:flex;gap:7px;align-items:flex-start;font-size:10.5px;line-height:1.45;padding:4px 5px;border-radius:7px;color:#5b4a3d}
#journal .jev:nth-child(odd){background:rgba(255,255,255,.4)}
#journal .jev time{font-family:var(--mono);font-size:9px;color:#a5958a;flex:0 0 32px;padding-top:1px}
#journal .jev em{font-style:normal;font-weight:700;color:#3d2f24}
#journal .jev .tag{font-family:var(--mono);font-size:8px;letter-spacing:.6px;padding:1px 4px;border-radius:4px;background:rgba(219,106,65,.14);color:#a8482a;text-transform:uppercase}

/* ---------- legend / toast ---------- */
#legend{position:fixed;left:16px;bottom:92px;z-index:16;border-radius:14px;padding:9px 12px;display:none;font-size:10.5px;color:#5b4a3d;min-width:150px}
#legend.show{display:block}
#panel.show ~ #legend{left:372px}
#legend b{display:block;font-family:var(--mono);font-size:8.5px;letter-spacing:1.6px;color:#8a7868;margin-bottom:6px;font-weight:700}
#legend .row{display:flex;align-items:center;gap:7px;padding:2px 0}
#legend .sm{color:#8a7868;font-size:9.5px;margin-left:auto}
#legend .sw{width:26px;height:0;border-top:3px solid var(--coral);border-radius:2px}
#legend .sw.dash{border-top:3px dashed var(--coral)}
#legend .sw.dot{border-top:3px dotted var(--coral)}

#toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,12px);z-index:24;padding:9px 16px;border-radius:999px;background:rgba(33,29,29,.9);color:#fff8f4;font-size:12px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- loader ---------- */
#loader{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 38%,#fffdf9,#f4e7d8 60%,#e8d5c4);transition:opacity .5s ease}
#loader.done{opacity:0;pointer-events:none}
#loader .inner{text-align:center;max-width:390px;padding:0 24px}
#loader .hexes{display:flex;justify-content:center;gap:7px;margin-bottom:18px}
#loader .hexes i{width:16px;height:18px;background:var(--coral);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);opacity:.3;animation:hexp 1.5s infinite}
#loader .hexes i:nth-child(2){animation-delay:.16s}
#loader .hexes i:nth-child(3){animation-delay:.32s}
@keyframes hexp{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-6px)}}
#loader h2{margin:0 0 8px;font-size:23px;letter-spacing:1px}
#loader p{margin:0;font-size:12px;color:#7d6b5c;letter-spacing:1px;font-family:var(--mono)}
#loader .bar{width:180px;height:3px;border-radius:3px;background:rgba(74,42,20,.1);margin:18px auto 0;overflow:hidden}
#loader .bar i{display:block;height:100%;width:38%;background:var(--coral);border-radius:3px;animation:load 1.4s infinite ease-in-out}
@keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(360%)}}
#loader.error .hexes,#loader.error .bar{display:none}
#loader.error h2{color:#b4502c}
#loader.error p{color:#8a3b24;font-family:var(--font);letter-spacing:0;line-height:1.7;white-space:pre-wrap}
#loader button{margin-top:16px;background:var(--ink);color:#fff8f4;padding:0 18px}

/* ---------- tour ---------- */
#tour{position:fixed;inset:0;z-index:60;display:none;place-items:center;background:rgba(33,29,29,.34);backdrop-filter:blur(5px);padding:20px}
#tour.show{display:grid}
#tour .box{width:min(460px,100%);border-radius:24px;padding:26px 26px 20px;background:rgba(255,252,247,.94);box-shadow:0 30px 80px rgba(50,25,10,.3)}
#tour h2{margin:6px 0 4px;font-size:25px;letter-spacing:-.3px}
#tour p{margin:0 0 18px;font-size:12.5px;line-height:1.7;color:#6b5a4c}
#tour .step{display:flex;gap:12px;padding:11px 0;border-top:1px solid rgba(74,42,20,.09)}
#tour .step b{flex:0 0 30px;height:30px;border-radius:10px;background:rgba(219,106,65,.14);color:#b4502c;display:grid;place-items:center;font-family:Georgia,serif;font-style:italic;font-size:15px}
#tour .step .tx{font-size:13px;font-weight:700;line-height:1.4}
#tour .step .tx span{display:block;font-weight:400;font-size:11px;color:#8a7868;margin-top:2px;line-height:1.5}
#tour .go{width:100%;margin-top:14px;background:var(--coral);color:#fff;font-weight:700;font-size:14px;min-height:46px;border-radius:11px}
#tour .go:hover{background:#c95a33}

/* ---------- CSS2D labels ---------- */
.islLabel{display:flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;background:rgba(255,252,247,.92);border:1px solid rgba(255,255,255,.9);box-shadow:0 4px 14px rgba(74,42,20,.18);font-size:10.5px;font-weight:700;color:#4d3c2f;white-space:nowrap;margin-bottom:6px;transition:opacity .2s,background .2s;pointer-events:auto;cursor:pointer}
.islLabel b{font-family:var(--mono);font-size:8px;color:#b09a88;letter-spacing:.5px}
.islLabel.dim{opacity:.42}
.islLabel.ink{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.islLabel.ink b{color:#e8b59d}
.pin{display:flex;align-items:center;gap:4px;padding:2px 8px 2px 3px;border-radius:999px;background:rgba(255,255,255,.94);box-shadow:0 4px 12px rgba(74,42,20,.2);font-size:10px;font-weight:700;white-space:nowrap;color:#3d2f24;margin-bottom:22px;transform-origin:50% 100%}
.pin b{width:17px;height:17px;border-radius:50%;background:var(--coral);color:#fff;display:grid;place-items:center;font-size:9px;font-weight:800}
.pin.mini{padding-right:3px}
.pin.mini span{display:none}
.bubble{padding:3px 8px;border-radius:9px;background:rgba(255,252,247,.96);box-shadow:0 4px 12px rgba(74,42,20,.2);font-size:9.5px;color:#4d3c2f;white-space:nowrap;margin-bottom:30px;font-weight:600}
.bubble b{color:var(--coral)}
.hide{display:none!important}

/* ---------- mobile ---------- */
#mobileTime{display:none}
#hud #mobileTime{display:none}
#sheetDock{display:none}
@media (max-width:800px){
  #brand{left:10px;top:10px;padding:9px 13px;border-radius:15px;gap:9px}
  #brand .mark{width:32px;height:32px;border-radius:9px;font-size:15px}
  #brand h1{font-size:15px}
  #brand h1 em{font-size:10px;letter-spacing:1.4px}
  #brand p{font-size:8px;letter-spacing:1.4px}
  #toolLeft{top:76px;bottom:auto;left:10px;flex-direction:column;padding:5px;gap:4px;border-radius:13px}
  #toolLeft button{width:42px;min-height:42px;font-size:15px}
  #journal{right:10px;top:10px;left:10px;width:auto;max-height:120px;display:none}
  #journal.show{display:flex}
  #sidebar,#panel{left:0;right:0;bottom:0;top:auto;width:100%;max-height:92vh;height:52%;border-radius:22px 22px 0 0;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
  #panel{height:34%}
  #sidebar.show,#panel.show{transform:translateY(0)}
  #panel.show{display:flex}
  #journal{display:none}
  #hud{left:auto;right:10px;bottom:10px;transform:none;padding:6px;border-radius:15px;gap:6px}
  #hud .grp.timeGrp,#hud .grp:nth-child(2) .sep,#hud .grp:nth-child(2)>div button:not(.keep){display:none}
  #hud .grp:nth-child(2)>div{flex-wrap:wrap;justify-content:flex-end;max-width:190px}
  #hud .grp:nth-child(2)>div button{width:40px;min-height:40px;font-size:8.5px}
  #hud.mobOpen .grp.timeGrp{display:flex;position:absolute;right:0;bottom:66px;background:rgba(255,250,244,.92);box-shadow:var(--shadow);border-radius:13px}
  #mobileTime{display:flex}
  #hud #mobileTime{display:flex}
  #legend{bottom:150px;left:10px;font-size:10px}
  #tour .box{padding:20px 18px 16px}
  #tour h2{font-size:21px}
}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="stage"></div>
<div id="labels"></div>

<header id="brand" class="glass">

function sampleDay(min){
  const m = ((min%1440)+1440)%1440;
  let a = dayColors[0], b = dayColors[1];
  for(let i=0;i<dayColors.length-1;i++){
    if(m >= dayColors[i].m && m <= dayColors[i+1].m){ a = dayColors[i]; b = dayColors[i+1]; break; }
  }
  const f = b.m===a.m ? 0 : (m-a.m)/(b.m-a.m);
  skyNow.top.copy(a.top).lerp(b.top,f);
  skyNow.hor.copy(a.hor).lerp(b.hor,f);
  skyNow.sun.copy(a.sun).lerp(b.sun,f);
  skyNow.sunI = lerp(a.sunI,b.sunI,f);
  skyNow.hs.copy(a.hs).lerp(b.hs,f);
  skyNow.hg.copy(a.hg).lerp(b.hg,f);
  skyNow.hi = lerp(a.hi,b.hi,f);
  skyNow.night = lerp(a.night,b.night,f);
  skyNow.water.copy(a.water).lerp(b.water,f);
}

/* ---------- sky ---------- */
function buildSky(){
  skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite:false, fog:false,
    uniforms:{
      uTop:{value:new THREE.Color('#9fd0ec')}, uHorizon:{value:new THREE.Color('#f4eee3')},
      uSunDir:{value:new THREE.Vector3(0,1,0)}, uSun:{value:new THREE.Color('#fff1de')}, uNight:{value:0}
    },
    vertexShader:`varying vec3 vDir; void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader:`
      uniform vec3 uTop, uHorizon, uSun, uSunDir; uniform float uNight; varying vec3 vDir;
      float hash(vec3 p){ p = fract(p*0.3183099 + vec3(0.1,0.2,0.3)); p *= 17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
      void main(){
        vec3 d = normalize(vDir);
        float h = smoothstep(-0.02, 0.55, d.y);
        vec3 col = mix(uHorizon, uTop, h);
        float sd = max(dot(d, normalize(uSunDir)), 0.0);
        col += uSun * pow(sd, 18.0) * 0.35;
        col += uSun * pow(sd, 220.0) * 0.45;
        if(uNight > 0.01){
          vec3 g = floor(d*180.0);
          float s = hash(g);
          float tw = step(0.9965, s);
          float above = smoothstep(0.0, 0.32, d.y);
          col += vec3(0.88,0.94,1.0) * tw * above * uNight * (0.55 + 0.45*sin(s*90.0));
        }
        gl_FragColor = vec4(col, 1.0);
      }`
  });
  const sky = new THREE.Mesh(new THREE.SphereGeometry(170, 32, 20), skyMat);
  sky.frustumCulled = false;
  scene.add(sky);
}

const WATER_VERT = `
  varying vec3 vWorld;
  #include <fog_pars_vertex>
  void main(){
    vec4 wp = modelMatrix * vec4(position,1.0);
    vWorld = wp.xyz;
    vec4 mvPosition = viewMatrix * wp;
    gl_Position = projectionMatrix * mvPosition;
    #include <fog_vertex>
  }`;
const WATER_FRAG = `
  uniform float uTime; uniform vec3 uShallow, uDeep; uniform float uNight;
  varying vec3 vWorld;
  #include <fog_pars_fragment>
  void main(){
    vec2 p = vWorld.xz;
    float w = sin(p.x*0.62 + uTime*0.36)*0.5 + sin(p.y*0.47 - uTime*0.28)*0.5 + sin((p.x+p.y)*0.23 + uTime*0.19);
    float d = length(p*vec2(0.9,1.1));
    float depth = smoothstep(9.0, 74.0, d);
    vec3 col = mix(uShallow, uDeep, clamp(depth + w*0.07, 0.0, 1.0));
    float sp = pow(max(0.0, sin(p.x*9.1 + uTime*1.7) * sin(p.y*8.3 - uTime*1.3)), 46.0);
    float hj = fract(sin(dot(floor(p*3.1), vec2(12.9898,78.233))) * 43758.5453);
    sp *= step(0.985, hj) * 0.8;
    col += sp * 0.45 * (1.0 - uNight*0.8);
    float shore = smoothstep(13.0, 5.0, d) * (0.5 + 0.5*sin(d*4.0 - uTime*0.9));
    col = mix(col, vec3(0.88,0.97,0.97), shore*0.12);
    gl_FragColor = vec4(col, 1.0);
    #include <fog_fragment>
  }`;
function waterMaterial(){

/* =========================================================
   BACKDROP — basin, forest, distant ridges, clouds
   ========================================================= */
function fbm(x,z,oct=4){
  let v=0, amp=.5, f=1;
  for(let i=0;i<oct;i++){ v += noise.noise3d(x*f, 0.31*i, z*f)*amp; amp*=.5; f*=2.03; }
  return v;
}
function terrainHeight(x,z){
  const r = Math.hypot(x,z);
  const ring = smoothstep(24, 50, r) * (1 - smoothstep(64, 84, r));
  let h = -3.4 + ring*13.0;
  const zs = smoothstep(0, 30, z);
  h -= zs * ring * 4.2;
  h += fbm(x*0.035, z*0.035, 4) * 3.1 * ring;
  h += fbm(x*0.11, z*0.11, 2) * 0.8 * ring;
  const q = Math.round(h*1.35)/1.35;
  h = lerp(h, q, 0.42);
  return h;
}
const TERRAIN_COLORS = [
  [ -2.0, new THREE.Color('#8fb3ad') ],
  [  0.35,new THREE.Color('#d9c9a3') ],
  [  1.6, new THREE.Color('#aec493') ],
  [  3.4, new THREE.Color('#a3b986') ],
  [  6.0, new THREE.Color('#6f8a62') ],
  [  9.5, new THREE.Color('#b2a38d') ]
];
function terrainColor(h, out){
  if(h <= TERRAIN_COLORS[0][0]) return out.copy(TERRAIN_COLORS[0][1]);
  for(let i=0;i<TERRAIN_COLORS.length-1;i++){
    const a=TERRAIN_COLORS[i], b=TERRAIN_COLORS[i+1];
    if(h>=a[0] && h<=b[0]){ const f=(h-a[0])/(b[0]-a[0]); return out.copy(a[1]).lerp(b[1], f); }
  }
  return out.copy(TERRAIN_COLORS[TERRAIN_COLORS.length-1][1]);
}
function buildTerrain(){
  const seg = isMobile()? 96 : 160;
  const geo = new THREE.PlaneGeometry(170,170,seg,seg).rotateX(-Math.PI/2);
  const pos = geo.attributes.position;
  const cols = new Float32Array(pos.count*3);
  const c = new THREE.Color();
  for(let i=0;i<pos.count;i++){
    const x = pos.getX(i), z = pos.getZ(i);
    const h = terrainHeight(x,z);
    pos.setY(i,h);
    terrainColor(h,c);
    const j = 0.94 + (noise.noise3d(x*0.6, 3.1, z*0.6)*0.5+0.5)*0.12;
    cols[i*3]=c.r*j; cols[i*3+1]=c.g*j; cols[i*3+2]=c.b*j;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(cols,3));
  geo.computeVertexNormals();
  const mat = new THREE.MeshStandardMaterial({ vertexColors:true, roughness:1, metalness:0, flatShading:true });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.y = 0;
  mesh.receiveShadow = true;
  scene.add(mesh);
}

    { geo:broad, color:new THREE.Color('#7f9c6b'), n:Math.floor(count*0.45) }
  ];
  specs.forEach(sp=>{
    const mat = new THREE.MeshStandardMaterial({ color:0xffffff, roughness:.95, metalness:0, flatShading:true });
    const im = new THREE.InstancedMesh(sp.geo, mat, sp.n);
    im.castShadow = false; im.receiveShadow = false;
    const c = new THREE.Color();
    let placed = 0, guard = 0;
    while(placed < sp.n && guard < sp.n*14){
      guard++;
      const a = rnd()*Math.PI*2;
      const rad = 26 + rnd()*30;
      const x = Math.cos(a)*rad, z = Math.sin(a)*rad;
      const y = terrainHeight(x,z);
      if(y < 0.6) continue;
      if(Math.hypot(x,z) < 25) continue;
      const s = 0.55 + rnd()*1.1;
      dummy.position.set(x, y-0.15, z);
      dummy.rotation.set(0, rnd()*6.28, 0);
      dummy.scale.setScalar(s);
      dummy.updateMatrix();
      im.setMatrixAt(placed, dummy.matrix);
      c.copy(sp.color).offsetHSL((rnd()-.5)*.03, (rnd()-.5)*.12, (rnd()-.5)*.12);
      im.setColorAt(placed, c);
      placed++;
    }
    im.count = placed;
    im.instanceMatrix.needsUpdate = true;
    if(im.instanceColor) im.instanceColor.needsUpdate = true;
    scene.add(im);
  });
}

function buildRidges(){
  const makeRing = (radius, minH, maxH, baseColor, opacity)=>{
    const N = 120;
    const pos = [], idx = [];
    for(let i=0;i<=N;i++){
      const a = i/N*Math.PI*2;
      const h = minH + (Math.sin(a*3.0+radius)*.5+.5)* (maxH-minH)*.55 + (noise.noise3d(Math.cos(a)*2.1, radius*.1, Math.sin(a)*2.1)*.5+.5)*(maxH-minH)*.65;
      const x = Math.cos(a)*radius, z = Math.sin(a)*radius;
      pos.push(x,-6,z, x,h,z);
      if(i<N){ const b=i*2; idx.push(b,b+1,b+2, b+1,b+3,b+2); }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
    g.setIndex(idx);
    g.computeVertexNormals();
    const c = baseColor.clone().lerp(skyNow.hor, opacity);
    const m = new THREE.MeshBasicMaterial({ color:c, side:THREE.DoubleSide, fog:true, transparent:true, opacity:.92, depthWrite:true });
    const mesh = new THREE.Mesh(g,m);
    mesh.userData.ridgeColor = baseColor;
    mesh.userData.ridgeMix = opacity;
    scene.add(mesh);
    return mesh;
  };
  skyNow.hor.set('#f4eee3');
  buildRidges.list = [
    makeRing(64, 1.2, 4.2, new THREE.Color('#8f9c93'), .35),
    makeRing(94, 2.2, 7.5, new THREE.Color('#7f8d8c'), .55),
    makeRing(126, 3.5, 11, new THREE.Color('#77828c'), .72)
  ];
}

let cloudGroup = [];
function buildClouds(){
  const mat = new THREE.MeshStandardMaterial({ color:0xfffaf3, roughness:1, metalness:0, flatShading:true });
  for(let i=0;i<12;i++){
    const g = new THREE.Group();
    const puffs = 3 + Math.floor(rnd()*4);
    const geos = [];
    for(let j=0;j<puffs;j++){
      const geo = new THREE.IcosahedronGeometry(1, 1);
      geo.scale(.8 + rnd()*1.1, .8 + rnd()*1.1, .8 + rnd()*1.1);
      geo.translate((rnd()-.5)*3.2, (rnd()-.5)*.6, (rnd()-.5)*1.6);
      geos.push(geo);
    }
    const merged = BufferGeometryUtils.mergeGeometries(geos, false);
    const m = new THREE.Mesh(merged, mat);
    g.add(m);
    const a = rnd()*Math.PI*2, rad = 24 + rnd()*40;
    g.position.set(Math.cos(a)*rad, 17 + rnd()*13, Math.sin(a)*rad);

    g.userData.speed = 0.28 + rnd()*0.5;
    g.userData.startX = g.position.x;
    scene.add(g);
    cloudGroup.push(g);
  }
}

function eulerMatrix(pos, scl, rot){
  dummy.position.set(pos[0],pos[1],pos[2]);
  dummy.rotation.set(rot?rot[0]:0, rot?rot[1]:0, rot?rot[2]:0);
  dummy.scale.set(scl[0],scl[1],scl[2]);
  dummy.updateMatrix();
  return dummy.matrix.clone();
}
function pushPart(list, kind, pos, scl, color, rot, itemId){
  const m = eulerMatrix(pos, scl, rot);
  m.scale(new THREE.Vector3(1+ (rnd()-.5)*0.014, 1+ (rnd()-.5)*0.014, 1+ (rnd()-.5)*0.014));
  list.push({ kind, matrix:m, color:new THREE.Color(color), itemId:itemId||null });
}

function makeKitMeshes(entries, isSmall){
  const byKind = new Map();
  entries.forEach((e,i)=>{ if(!byKind.has(e.kind)) byKind.set(e.kind, []); byKind.get(e.kind).push({...e, order:i}); });
  const meshes = [];
  byKind.forEach((list, kind)=>{
    const geo = GEO[kind] || GEO.box;
    const glow = kind.indexOf('glow')===0;
    const mat = glow ? matGlow : matSolid;
    const im = new THREE.InstancedMesh(geo, mat, list.length);
    im.castShadow = !isSmall;
    im.receiveShadow = false;
    const ids = [];
    const bases = [];
    list.forEach((e,i)=>{
      im.setMatrixAt(i, e.matrix);
      im.setColorAt(i, e.color);
      ids.push(e.itemId);
      bases.push(e.color.clone());
    });
    im.instanceMatrix.needsUpdate = true;
    if(im.instanceColor) im.instanceColor.needsUpdate = true;
    im.userData.itemIds = ids;
    im.userData.baseColors = bases;
    im.userData.isSmall = !!isSmall;
    im.frustumCulled = false;
    scene.add(im);
    meshes.push(im);
  });
  return meshes;
}

function insideHex(x,z,rad){
  const a = Math.atan2(z,x);
  const seg = Math.PI/3;
  let t = ((a % seg) + seg) % seg - seg/2;
  const bound = (rad*Math.sqrt(3)/2) / Math.cos(t);
  return Math.hypot(x,z) <= bound;
}

function makeGroundTexture(type){
  const cv = document.createElement('canvas');
  cv.width = cv.height = 256;
  const g = cv.getContext('2d');
  g.fillStyle = '#f2e7d7'; g.fillRect(0,0,256,256);
  if(type==='brick'){
    for(let row=0; row<8; row++){
      const h = 32, y = row*h;
      for(let col=-1; col<9; col++){
        const w = 32, x = col*w + (row%2? w/2:0);
        const v = 0.95 + rnd()*0.09;
        g.fillStyle = `rgb(${Math.floor(238*v)},${Math.floor(225*v)},${Math.floor(208*v)})`;
        g.fillRect(x+1.5,y+1.5,w-3,h-3);
      }
      g.strokeStyle = 'rgba(196,178,158,.35)'; g.lineWidth = 1;
      g.beginPath(); g.moveTo(0,y+.5); g.lineTo(256,y+.5); g.stroke();
    }
  } else if(type==='speckle'){
    for(let i=0;i<620;i++){
      const x = rnd()*256, y = rnd()*256, r = .6 + rnd()*2.4;
      g.fillStyle = `rgba(${180+rnd()*40|0},${165+rnd()*40|0},${145+rnd()*35|0},${.18+rnd()*.28})`;
      g.beginPath(); g.arc(x,y,r,0,6.283); g.fill();
    }
    g.strokeStyle = 'rgba(206,190,170,.22)';
    for(let i=0;i<14;i++){ g.beginPath(); g.arc(rnd()*256,rnd()*256,20+rnd()*50,0,6.283); g.stroke(); }

function buildBridges(){
  const dirs = [[1,0],[0,1],[-1,1],[-1,0],[0,-1],[1,-1]];
  const used = new Set();
  islands.forEach((a, i)=>{
    dirs.forEach(([dq,dr])=>{
      const j = AXIAL.findIndex(([q,r])=> q===AXIAL[i][0]+dq && r===AXIAL[i][1]+dr);
      if(j < 0) return;
      const key = Math.min(i,j)+'-'+Math.max(i,j);
      if(used.has(key)) return;
      used.add(key);
      const A = islands[i], B = islands[j];
      const nx = (B.x-A.x)/Math.hypot(B.x-A.x, B.z-A.z);
      const nz = (B.z-A.z)/Math.hypot(B.x-A.x, B.z-A.z);
      const start = new THREE.Vector3(A.x + nx*1.74, TOP, A.z + nz*1.74);
      const end = new THREE.Vector3(B.x - nx*1.74, TOP, B.z - nz*1.74);
      const len = start.distanceTo(end);
      const ry = Math.atan2(nx, nz);
      for(let k=0;k<9;k++){
        const f = (k+0.5)/9;
        const arch = Math.sin(f*Math.PI) * (0.045 + ((i+j)%4)*0.014);
        pushPart(kitEntries, 'rbox', [lerp(start.x,end.x,f), TOP+0.02+arch, lerp(start.z,end.z,f)], [0.34, 0.055, len/9*1.12], '#e8d9c4', [0, ry, 0]);
      }
      [-1,1].forEach(side=>{
        const ox = Math.cos(ry)*side*0.17, oz = -Math.sin(ry)*side*0.17;
        pushPart(kitEntries, 'box', [(start.x+end.x)/2+ox, TOP+0.15, (start.z+end.z)/2+oz], [0.03, 0.03, len*0.92], '#c5b5a7', [0, ry, 0]);
      });
      A.bridges = A.bridges||[]; B.bridges = B.bridges||[];
      const midA = nearestMidNode(A, B);
      const midB = nearestMidNode(B, A);
      A.bridges.push({to:B, node:midA});
      B.bridges.push({to:A, node:midB});
      A.bridgeLinks = A.bridgeLinks||[]; A.bridgeLinks.push([midA, midB]);
    });
  });
}

function nearestMidNode(a,b){
  if(!a.nodes) return null;
  let best = null, bd = 1e9;
  for(let k=6;k<12;k++){
    const n = a.nodes[k];
    const d = Math.hypot(n.x-b.x, n.z-b.z);
    if(d < bd){ bd = d; best = n; }
  }
  return best;
}

function chooseSlots(n, cell, seed){
  const step = cell*1.04;
  const cand = [];
  for(let row=-3; row<=3; row++){
    const z = row*step*0.9;
    const off = (row&1)? step*0.5 : 0;
    for(let col=-3; col<=3; col++){
      const x = col*step + off;
      if(!insideHex(x,z,1.34)) continue;
      if(Math.hypot(x, z+0.58) < 0.76) continue;
      cand.push({x,z, key: Math.hypot(x*0.9, (z-0.2)*1.1) + ((col+row*7+seed)%5)*0.013});
    }
  }
  cand.sort((a,b)=> a.key-b.key);
  const out = [];
  for(const c of cand){
    if(out.length >= n) break;
    if(out.every(o=> Math.hypot(o.x-c.x, o.z-c.z) > cell*1.02)) out.push(c);
  }
  return out;
}

  );
  const full = base.multiply(itemM);

  parts.forEach(p=>{

/* ---------- walk graph ---------- */
function buildWalkGraph(){
  islands.forEach(isl=>{
    for(let k=0;k<12;k++){
      const n = isl.nodes[k], nn = isl.nodes[(k+1)%12];
      const w = Math.hypot(n.x-nn.x, n.z-nn.z);
      n.adj.push({ n:nn, w });
      nn.adj.push({ n:n, w });
    }
    (isl.bridgeLinks||[]).forEach(([a,b])=>{
      if(!a||!b) return;
      const w = Math.hypot(a.x-b.x, a.z-b.z);
      a.adj.push({ n:b, w });
      b.adj.push({ n:a, w });
    });
  });
  graph = { nodes: islands.flatMap(i=>i.nodes) };
}

function dijkstra(start, end){
  const nodes = graph.nodes;
  const dist = new Map(), prev = new Map(), open = [];
  nodes.forEach(n=> dist.set(n, Infinity));
  dist.set(start, 0); open.push(start);
  while(open.length){
    let bi = 0;
    for(let i=1;i<open.length;i++) if(dist.get(open[i]) < dist.get(open[bi])) bi = i;
    const cur = open.splice(bi,1)[0];
    if(cur === end) break;
    cur.adj.forEach(e=>{
      const nd = dist.get(cur) + e.w;
      if(nd < (dist.get(e.n) ?? Infinity)-1e-6){
        dist.set(e.n, nd); prev.set(e.n, cur);
        if(!open.includes(e.n)) open.push(e.n);
      }
    });
  }
  const path = [];
  let c = end;
  while(c){ path.unshift(c); c = prev.get(c); }
  return path;
}

function routeBetween(themeA, themeB){
  const A = themeA.island, B = themeB.island;
  let start = A.nodes[0], end = B.nodes[0], bd = 1e9;
  A.nodes.forEach(na=> B.nodes.forEach(nb=>{
    const d = Math.hypot(na.x-nb.x, na.z-nb.z);
    if(d < bd){ bd = d; start = na; end = nb; }
  }));
  const path = dijkstra(start, end);
  return path.map(n=> new THREE.Vector3(n.x, TOP+0.03, n.z));
}

function buildFlows(){
  DATA.flows.forEach(f=>{
    const from = themeById.get(f.from), to = themeById.get(f.to);
    if(!from || !to) return;
    const route = routeBetween(from, to);
    const flow = { ...f, fromTheme:from, toTheme:to, route, walkers:[] };
    flowById.set(f.id, flow);
    flows.push(flow);
    const pts = route.map(p=> new THREE.Vector3(p.x, TOP+0.22, p.z));
    if(pts.length < 2) pts.push(pts[0].clone().add(new THREE.Vector3(0.01,0,0.01)));
    const curve = new THREE.CatmullRomCurve3(pts, false, 'centripetal', 0.4);
    const len = curve.getLength();
    const geo = new THREE.TubeGeometry(curve, Math.max(28, pts.length*3), 0.05, 6, false);
    const mat = new THREE.ShaderMaterial({
      transparent:true, depthWrite:false, fog:false,
      uniforms:{
        uTime:{value:0}, uLength:{value:len}, uPattern:{value: f.evidence==='official'?0 : f.evidence==='thematic'?1 : 2},
        uColor:{value:new THREE.Color('#db6a41')}, uOpacity:{value:.82}
      },
      vertexShader:`varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
      fragmentShader:`
        uniform float uTime, uLength, uPattern, uOpacity; uniform vec3 uColor; varying vec2 vUv;
        void main(){
          float u = vUv.x*uLength*5.0 - uTime*1.4;
          float f = fract(u);
          if(uPattern > 0.5 && f > 0.6) discard;
          if(uPattern > 1.5 && f > 0.3) discard;
          gl_FragColor = vec4(uColor, uOpacity);
        }`
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.visible = false;
    mesh.userData.flowId = f.id;
    scene.add(mesh);
    flow.mesh = mesh;
    flow.material = mat;
    flow.length = len;
    flow.curve = curve;
    flow.points = pts;
  });
}

function buildWalkers(){
  const N = flows.reduce((s,f)=> s + (f.walkers.length||0), 0);
  let total = 0;
  flows.forEach(f=>{
    const n = 4 + Math.floor(rnd()*4);
    f.walkers = [];
    for(let i=0;i<n;i++){
      const roleKey = f.walker;
      const role = ROLES[roleKey] || ROLES.student;
      const w = {
        flow:f, roleKey, role,
        dist: ((i + 0.5)/n) * (f.length||1),
        dir: i%2 ? -1 : 1,
        wait: 0,
        speed: (roleKey==='commuter'? .62 + rnd()*.08 : .32 + rnd()*.08),
        phase: rnd(),
        height: .33 + rnd()*.04,
        scale: 1,
        cargo: f.cargo,
        nameEl:null, sprite:null
      };
      f.walkers.push(w);
      walkers.push(w);
      total++;
    }
  });

  const mk = (geo, mat, count)=> {
    const im = new THREE.InstancedMesh(geo, mat, Math.max(1,count));
    im.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    im.frustumCulled = false;
    im.castShadow = false;
    im.receiveShadow = false;
    scene.add(im);
    return im;
  };
  const matPerson = new THREE.MeshStandardMaterial({ color:0xffffff, roughness:.82, metalness:0 });
  const matPlain = new THREE.MeshStandardMaterial({ color:0xffffff, roughness:.86, metalness:0 });
  const legGeo = new THREE.BoxGeometry(.042,.12,.042).translate(0,-.06,0);
  const armGeo = new THREE.BoxGeometry(.034,.11,.034).translate(0,-.055,0);
  const bodyGeo = new THREE.CapsuleGeometry(.048,.06,3,8);
  const headGeo = new THREE.SphereGeometry(.078,12,10);
  const hairGeo = new THREE.SphereGeometry(.081,12,8,0,Math.PI*2,0,Math.PI*.62);
  const eyeGeo = new THREE.SphereGeometry(.0095,6,5);
  const hatGeo = new THREE.ConeGeometry(.082,.1,10);
  const shadowGeo = new THREE.CircleGeometry(.085,12).rotateX(-Math.PI/2);
  const accBoxGeo = new THREE.BoxGeometry(1,1,1);
  const accCylGeo = new THREE.CylinderGeometry(.5,.5,1,8);

  ACTOR.legs = mk(legGeo, matPerson, total*2);
  ACTOR.arms = mk(armGeo, matPerson, total*2);
  ACTOR.body = mk(bodyGeo, matPerson, total);
  ACTOR.head = mk(headGeo, matPerson, total);
  ACTOR.hair = mk(hairGeo, matPlain, total);
  ACTOR.eye = mk(eyeGeo, matPlain, total*2);
  ACTOR.hat = mk(hatGeo, matPlain, total);
  ACTOR.accBox = mk(accBoxGeo, matPlain, total);
  ACTOR.accCyl = mk(accCylGeo, matPlain, total);
  ACTOR.shadow = mk(shadowGeo, new THREE.MeshBasicMaterial({ color:0x211d1d, transparent:true, opacity:.22, depthWrite:false }), total);

  // helper meshes for picking (invisible)
  const hitGeo = new THREE.SphereGeometry(.19, 8, 6);
  const hitMat = new THREE.MeshBasicMaterial({ transparent:true, opacity:0, depthWrite:false });
  const hit = new THREE.InstancedMesh(hitGeo, hitMat, Math.max(1,total));
  hit.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  hit.frustumCulled = false;
  hit.userData.walkerIds = walkers.map((_,i)=>i);
  scene.add(hit);
  walkerPick = hit;

  walkers.forEach((w,i)=>{
    const c = new THREE.Color(w.role.body);
    ACTOR.body.setColorAt(i, c);
    ACTOR.legs.setColorAt(i*2, new THREE.Color('#3a3430'));
    ACTOR.legs.setColorAt(i*2+1, new THREE.Color('#3a3430'));
    ACTOR.arms.setColorAt(i*2, new THREE.Color(w.role.body).offsetHSL(0,0,-.04));
    ACTOR.arms.setColorAt(i*2+1, new THREE.Color(w.role.body).offsetHSL(0,0,-.04));
    ACTOR.head.setColorAt(i, new THREE.Color(pick(SKIN)));
    ACTOR.hair.setColorAt(i, new THREE.Color(w.role.hair));
    ACTOR.eye.setColorAt(i*2, new THREE.Color('#241f1d'));
    ACTOR.eye.setColorAt(i*2+1, new THREE.Color('#241f1d'));
    ACTOR.hat.setColorAt(i, new THREE.Color(w.role.hat==='helmet'? '#fcea8b' : w.role.hat==='straw'? '#e8cf94' : w.role.body));
    ACTOR.accBox.setColorAt(i, new THREE.Color(w.role.acc==='suitcase'? '#b4502c' : w.role.acc==='case'? '#3e7c8c' : w.role.acc==='basket'? '#b48560' : '#fcea8b'));
    ACTOR.accCyl.setColorAt(i, new THREE.Color('#c5b5a7'));
    ACTOR.shadow.setColorAt(i, new THREE.Color('#211d1d'));
    w.idx = i;

    // sprite badge
    const spMat = new THREE.SpriteMaterial({ map:getBadge(w.cargo), transparent:true, depthWrite:false, depthTest:true, opacity:1 });
    const sp = new THREE.Sprite(spMat);
    sp.scale.set(.26,.26,.26);
    sp.visible = false;
    scene.add(sp);
    w.sprite = sp;

    // name bubble
    const el = document.createElement('div');
    el.className = 'bubble hide';
    el.innerHTML = `${t('正在搬','Carrying')} <b>${t(w.cargo, w.flow.cargoEn)}</b>`;
    const obj = new CSS2DObject(el);
    obj.visible = false;
    scene.add(obj);
    w.nameEl = el; w.nameObj = obj;
  });
  Object.values(ACTOR).forEach(im=>{
    if(im.instanceMatrix) im.instanceMatrix.needsUpdate = true;
    if(im.instanceColor) im.instanceColor.needsUpdate = true;
  });
}

function applyWalkerMatrices(){
  const camDist = camera.position.distanceTo(controls.target);
  const boost = clamp(camDist/20, 1, 1.45);
  const tNow = state.reduced ? 0 : state.animTime;
  walkers.forEach(w=>{
    const route = w.flow.route;
    if(!route || route.length < 2) return;
    const total = w.flow.length;
    const d = clamp(w.dist, 0, total);
    // locate segment by arc length approximation
    const f = d/total;
    const fp = f*(route.length-1);
    const i0 = Math.min(route.length-2, Math.floor(fp));
    const ft = fp - i0;
    const a = route[i0], b = route[i0+1];
    const px = lerp(a.x,b.x,ft), pz = lerp(a.z,b.z,ft), py = lerp(a.y,b.y,ft);
    const head = Math.atan2(b.x-a.x, b.z-a.z) + (w.dir<0? Math.PI : 0);
    const speedPhase = w.wait>0? 0 : 1;
    const ph = tNow*9 + w.phase*20;
    const swing = speedPhase * Math.sin(ph) * .55;
    const bob = speedPhase * Math.abs(Math.sin(ph)) * .012;
    const s = w.height * w.scale * boost;

    const base = new THREE.Matrix4().compose(
      new THREE.Vector3(px, py + bob, pz),
      new THREE.Quaternion().setFromEuler(new THREE.Euler(0, head, 0)),
      new THREE.Vector3(s, s, s)
    );
    const put = (im, index, lx,ly,lz, rx,ry,rz, sx,sy,sz, pivot)=>{
      const local = new THREE.Matrix4().compose(
        new THREE.Vector3(lx,ly,lz),
        new THREE.Quaternion().setFromEuler(new THREE.Euler(rx,ry,rz)),
        new THREE.Vector3(sx,sy,sz)
      );
      const m = base.clone().multiply(local);
      im.setMatrixAt(index, m);
    };
    const i = w.idx;
    const hipY = .12, shY = .235;
    put(ACTOR.legs, i*2,   -.028, hipY, 0, swing,0,0, 1,1,1);
    put(ACTOR.legs, i*2+1,  .028, hipY, 0, -swing,0,0, 1,1,1);
    put(ACTOR.arms, i*2,   -.062, shY, 0, -swing*.82,0,.12, 1,1,1);
    put(ACTOR.arms, i*2+1,  .062, shY, 0,  swing*.82,0,-.12, 1,1,1);
    put(ACTOR.body, i, 0,.2,0, 0,0,0, 1,1,1);
    put(ACTOR.head, i, 0,.318,0, 0,0,0, 1,1,1);
    put(ACTOR.hair, i, 0,.322,0, 0,0,0, 1,1,1);
    put(ACTOR.eye, i*2,   -.026,.324,.066, 0,0,0, 1,1,1);
    put(ACTOR.eye, i*2+1,  .026,.324,.066, 0,0,0, 1,1,1);
    put(ACTOR.shadow, i, 0,.004,0, 0,0,0, 1,1,1);
    // hat
    if(w.role.hat==='none') put(ACTOR.hat, i, 0,0,0, 0,0,0, 0.001,0.001,0.001);
    else if(w.role.hat==='helmet') put(ACTOR.hat, i, 0,.352,0, 0,0,0, 1.05,.7,1.05);
    else put(ACTOR.hat, i, 0,.40,0, 0,0,0, 1,1,1);
    // accessories
    const acc = w.role.acc;
    if(acc==='suitcase') put(ACTOR.accBox, i, .09,.085,.03, 0,0,0, .062,.09,.035);
    else if(acc==='pack') put(ACTOR.accBox, i, 0,.21,-.075, 0,0,0, .085,.12,.05);
    else if(acc==='tablet') put(ACTOR.accBox, i, 0,.19,.075, .35,0,0, .1,.012,.075);
    else if(acc==='case') put(ACTOR.accBox, i, .1,.06,.02, 0,0,0, .07,.08,.04);
    else if(acc==='basket') put(ACTOR.accBox, i, -.09,.14,.02, 0,0,0, .07,.06,.07);
    else if(acc==='bike'){ put(ACTOR.accBox, i, 0,.09,0, 0,0,0, .18,.02,.02); put(ACTOR.accCyl, i, 0,0,0, 0,0,0,.001,.001,.001); }
    else if(acc==='cane') put(ACTOR.accCyl, i, .085,.07,.03, 0,0,0, .018,.28,.018);
    else if(acc==='stroller'){ put(ACTOR.accBox, i, .13,.07,.06, 0,0,0, .11,.1,.08); put(ACTOR.accCyl, i, .13,.02,.06, 0,0,0,.001,.001,.001); }
    else put(ACTOR.accBox, i, 0,0,0, 0,0,0, .001,.001,.001);
    if(acc!=='cane' && acc!=='stroller') put(ACTOR.accCyl, i, 0,0,0, 0,0,0, .001,.001,.001);

    // sprite + bubble positions
    w.sprite.position.set(px, py + s*.72, pz);
    const distCam = camera.position.distanceTo(w.sprite.position);
    w.sprite.visible = distCam < 16 && state.toggles.cargo;
    w.sprite.scale.setScalar(s*.58);
    w.nameObj.position.set(px, py + s*.78, pz);
    const showNames = state.toggles.names && distCam < 14;
    w.nameObj.visible = showNames;
    if(showNames){ w.nameEl.classList.remove('hide'); } else { w.nameEl.classList.add('hide'); }

    // pick helper
    const hitM = new THREE.Matrix4().compose(
      new THREE.Vector3(px, py + s*.34, pz),
      new THREE.Quaternion(),
      new THREE.Vector3(s/.33, s/.33, s/.33)
    );
    walkerPick.setMatrixAt(i, hitM);
  });
  Object.values(ACTOR).forEach(im=>{ im.instanceMatrix.needsUpdate = true; });
  walkerPick.instanceMatrix.needsUpdate = true;
}

function updateWalkers(dt){
  if(state.reduced) dt = 0;
  walkers.forEach(w=>{
    if(w.wait > 0){ w.wait -= dt; }
    else {
      w.dist += w.speed * dt * w.dir;
      if(w.dist >= w.flow.length){
        w.dist = w.flow.length; w.dir = -1; w.wait = 1.4;
        logEvent('arrive', w); logEvent('handoff', w);
      } else if(w.dist <= 0){
        w.dist = 0; w.dir = 1; w.wait = 1.4;
        logEvent('depart', w);
      }
    }
  });
}

function refreshColors(){
  const apply = (meshes)=>{
    meshes.forEach(im=>{
      const ids = im.userData.itemIds, bases = im.userData.baseColors;
      if(!ids) return;
      let touched = false;
      for(let i=0;i<ids.length;i++){
        const id = ids[i];
        if(!id) continue;
        if(!selectedParts.has(id) && !litParts.has(id)) {
          if(im.userData._painted && im.userData._painted[i]) { im.setColorAt(i, bases[i]); im.userData._painted[i] = false; touched = true; }
          continue;
        }
        const c = bases[i].clone();
        if(litParts.has(id)) c.lerp(COL.yellow, .22);
        if(selectedParts.has(id)) c.lerp(COL.coral, .22);
        im.setColorAt(i, c);
        im.userData._painted = im.userData._painted || [];
        im.userData._painted[i] = true;
        touched = true;
      }
      if(touched && im.instanceColor) im.instanceColor.needsUpdate = true;
    });
  };
  apply(kitMeshes); apply(smallMeshes);
}

function makeThumb(item){
  if(item._thumb) return item._thumb;
  if(!thumbRenderer){
    thumbRenderer = new THREE.WebGLRenderer({ antialias:true, alpha:true, preserveDrawingBuffer:true });
    thumbRenderer.setPixelRatio(2);
    thumbRenderer.setSize(160,160);
    thumbRenderer.outputColorSpace = THREE.SRGBColorSpace;
    thumbRenderer.toneMapping = THREE.ACESFilmicToneMapping;
    thumbCam = new THREE.PerspectiveCamera(30, 1, .1, 30);
    thumbCam.position.set(1.55, 1.15, 1.75);
    thumbCam.lookAt(0, .52, 0);
  }
  const sc = new THREE.Scene();
  sc.add(new THREE.HemisphereLight(0xeef6fa, 0x8f8270, 2.1));
  const dl = new THREE.DirectionalLight(0xfff1de, 2.4);
  dl.position.set(3,5,4); sc.add(dl);
  const group = new THREE.Group();
  (item._parts || []).forEach(p=>{
    const geo = GEO[p.kind] || GEO.box;
    const glow = p.kind.indexOf('glow')===0;
    const mat = new THREE.MeshStandardMaterial({ color:new THREE.Color(p.color), roughness: glow?0.5:0.78, metalness:0, emissive: glow? new THREE.Color('#ffc777'):0x000000, emissiveIntensity: glow?1.4:0 });
    const m = new THREE.Mesh(geo, mat);
    m.position.set(p.pos[0], p.pos[1], p.pos[2]);
    m.rotation.set(p.rot?p.rot[0]:0, p.rot?p.rot[1]:0, p.rot?p.rot[2]:0);
    m.scale.set(p.scl[0], p.scl[1], p.scl[2]);
    group.add(m);
  });
  group.rotation.y = -0.35;
  sc.add(group);
  thumbRenderer.render(sc, thumbCam);
  const url = thumbRenderer.domElement.toDataURL('image/png');
  item._thumb = url;
  group.traverse(o=>{ if(o.material) o.material.dispose(); });
  return url;
}

function focusCamera(offset, target){
  const cardPad = (!isMobile() && document.getElementById('panel').classList.contains('show')) ? 1.5 : 0;
  const mob = isMobile();
  const pos = target.clone().add(offset.clone().multiplyScalar(mob? 1.55 : 1));
  pos.x += cardPad;
  const look = target.clone().add(new THREE.Vector3(0, .35, 0));
  if(mob) look.y -= .55;
  flyTo(pos, look);
}
function flyTo(pos, target, dur){
  if(state.reduced || dur === 0){ camera.position.copy(pos); controls.target.copy(target); controls.update(); markDirty(); return; }
  state.flying = {
    t0: performance.now(), dur: dur || 800,
    p0: camera.position.clone(), p1: pos,
    t0v: controls.target.clone(), t1v: target
  };
}
const easeInOutCubic = x => x<.5 ? 4*x*x*x : 1 - Math.pow(-2*x+2,3)/2;

function updateFlowsVisibility(){
  const sel = state.selected;
  const activeThemes = new Set();
  if(sel){
    if(sel.themeId) activeThemes.add(sel.themeId);
    if(sel.type==='flow' || sel.type==='walker'){
      const f = flowById.get(sel.flowId);
      if(f){ activeThemes.add(f.from); activeThemes.add(f.to); }
    }
  }
  let any = false;
  flows.forEach(f=>{
    const related = state.toggles.flows || activeThemes.has(f.from) || activeThemes.has(f.to);
    f.mesh.visible = related;
    if(related) any = true;
  });
  document.getElementById('legend').classList.toggle('show', any);
}

function syncLabels(){
  const sel = state.selected;
  islands.forEach(isl=>{
    isl.labelEl.classList.toggle('ink', !!(sel && sel.themeId === isl.theme.id));
    isl.labelEl.classList.toggle('dim', !!(sel && sel.themeId && sel.themeId !== isl.theme.id));
  });
}

function overviewDistance(){
  const a = innerWidth/innerHeight;
  if(a < 0.85) return 56;
  if(a < 1.4) return 38;
  return 28.5;
}
function goOverview(instant){
  const dir = new THREE.Vector3(.24,.33,.87).normalize();
  const target = new THREE.Vector3(0,.6,0);
  const pos = target.clone().add(dir.multiplyScalar(overviewDistance()));
  if(instant || state.reduced) flyTo(pos, target, 0);
  else flyTo(pos, target, 800);
  state.bird = false;
  syncToggleButtons();
}
function goBird(){
  const target = controls.target.clone();
  const pos = target.clone().add(new THREE.Vector3(0.01,42,6));
  if(state.reduced) flyTo(pos,target,0); else flyTo(pos,target,800);
  state.bird = true;
  syncToggleButtons();
}

function renderSidebar(){
  const q = state.search.trim().toLowerCase();
  if(state.tab==='themes'){
    const rows = DATA.themes.map(theme=>{
      const items = theme.items.filter(it=> !q || (it.zh+' '+it.en+' '+it.d+' '+it.de).toLowerCase().includes(q));
      const themeMatch = !q || (theme.zh+' '+theme.en+' '+theme.zhSum).toLowerCase().includes(q);
      if(!items.length && !themeMatch) return '';
      const shown = themeMatch? theme.items : items;
      return `<details ${q&&items.length?'open':''}>
        <summary><span class="num">${theme.num}</span><span class="ico">${theme.icon}</span><span>${t(theme.zh,theme.en)}</span><span class="cnt">${theme.items.length}</span></summary>
        <div class="items">
          <button class="iRow" data-theme="${theme.id}"><b>→</b><span>${t('看整座島','Open island card')}</span></button>
          ${shown.map((it,k)=>`<button class="iRow" data-item="${it.id}"><b>${theme.items.indexOf(it)+1}</b><span>${t(it.zh,it.en)}</span></button>`).join('')}
        </div>
      </details>`;
    }).join('');
    sidebarBody.innerHTML = rows || `<div class="empty">${t('找不到符合的關鍵字。','Nothing matches that search.')}</div>`;
  } else {
    const rows = flows.filter(f=>{
      if(!q) return true;
      const s = [f.cargo,f.cargoEn,f.fromTheme.zh,f.toTheme.zh,f.fromTheme.en,f.toTheme.en].join(' ').toLowerCase();
      return s.includes(q);
    }).map(f=>`
      <button class="fRow" data-flow="${f.id}">
        <span class="fl"><i>${f.fromTheme.icon}</i>${t(f.fromTheme.zh,f.fromTheme.en)} <i>→</i> ${t(f.toTheme.zh,f.toTheme.en)}</span>
        <span class="sm"><span class="ev ${f.evidence}">${f.evidence}</span>${t(f.cargo,f.cargoEn)}</span>
      </button>`).join('');
    sidebarBody.innerHTML = rows || `<div class="empty">${t('沒有符合的協作線。','No links match.')}</div>`;
  }
}

/* ---------- toggles ---------- */
function syncToggleButtons(){
  document.querySelectorAll('#hud [data-toggle]').forEach(b=>{
    const k = b.dataset.toggle;
    const on = k==='bird' ? state.bird : (k==='journal' ? state.toggles.journal : state.toggles[k]);
    b.classList.toggle('on', !!on);
  });
}
function setToggle(k){
  if(k==='bird'){ state.bird? goOverview(): goBird(); syncToggleButtons(); return; }
  if(k==='journal'){ state.toggles.journal = !state.toggles.journal; document.getElementById('journal').classList.toggle('show', state.toggles.journal); syncToggleButtons(); return; }
  state.toggles[k] = !state.toggles[k];
  if(k==='flows') updateFlowsVisibility();
  syncToggleButtons();
  markDirty();
}

/* ---------- environment ---------- */
let lastSlotKey = '';
function updateEnvironment(){
  sampleDay(state.timeMin);
  const min = (Math.round(state.timeMin/10)*10) % 1440;
  const tt = clamp((min-360)/720, 0, 1);
  const az = Math.PI*(0.15 + 0.7*tt);
  const el = 0.35 + Math.sin(tt*Math.PI)*0.75;
  const dir = new THREE.Vector3(Math.cos(az)*Math.cos(el), Math.sin(el), 0.55*Math.cos(el)+0.35).normalize();
  skyNow.dir.copy(dir);
  sun.position.set(0,.4,0).addScaledVector(dir, 40);
  sun.color.copy(skyNow.sun);
  sun.intensity = skyNow.sunI;
  hemi.color.copy(skyNow.hs);
  hemi.groundColor.copy(skyNow.hg);
  hemi.intensity = skyNow.hi;
  fill.intensity = .2 + skyNow.sunI*.05;

  skyMat.uniforms.uTop.value.copy(skyNow.top);
  skyMat.uniforms.uHorizon.value.copy(skyNow.hor);
  skyMat.uniforms.uNight.value = skyNow.night;
  skyMat.uniforms.uSun.value.copy(skyNow.sun).multiplyScalar(clamp(skyNow.sunI/2.9,0,1));
  skyMat.uniforms.uSunDir.value.copy(dir);

  scene.fog.color.copy(skyNow.hor);
  document.documentElement.style.setProperty('--fog', '#'+skyNow.hor.getHexString());

  waterMat.uniforms.uTime.value = state.reduced ? 0 : state.animTime;
  waterMat.uniforms.uNight.value = skyNow.night;
  waterMat.uniforms.uDeep.value.copy(skyNow.water);
  waterMat.uniforms.uShallow.value.copy(skyNow.water).lerp(COL.white, .45);

  matGlow.emissiveIntensity = 0.15 + skyNow.night*3.2;
  if(poolMat) poolMat.opacity = skyNow.night*.55;
  if(buildRidges.list) buildRidges.list.forEach(m=>{
    m.material.color.copy(m.userData.ridgeColor).lerp(skyNow.hor, m.userData.ridgeMix);
  });

  const slot = currentDaySlot();
  const key = slot.at + '|' + state.timeMin.toFixed(0);
  const slotKey = String(slot.at);
  if(slotKey !== lastSlotKey){
    lastSlotKey = slotKey;
    litParts = new Set(slot.items);
    refreshColors();
  }
}

/* ---------- label collision ---------- */
function overlaps(a,b,pad){
  return a.left < b.right+pad && a.right > b.left-pad && a.top < b.bottom+pad && a.bottom > b.top-pad;
}
let labelTick = 0;
function layoutLabels(){
  const uiSel = '#panel.show,#sidebar,#journal,#hud,#brand,#toolLeft,#legend.show';
  const blocks = [...document.querySelectorAll(uiSel)].map(el=>el.getBoundingClientRect());
  const kept = [];
  document.querySelectorAll('#labels .islLabel, #labels .pin, #labels .bubble').forEach(el=>{
    el.classList.remove('mini');
    if(el.classList.contains('hide')){ el.style.visibility = 'hidden'; return; }
    let r = el.getBoundingClientRect();
    if(!r.width){ el.style.visibility='hidden'; return; }
    if(blocks.some(b=> overlaps(r,b,4))){ el.style.visibility='hidden'; return; }
    if(kept.some(k=> overlaps(r,k,8))){
      if(el.classList.contains('pin')){
        el.classList.add('mini');
        r = el.getBoundingClientRect();
        if(kept.some(k=> overlaps(r,k,8))){ el.style.visibility='hidden'; return; }
      } else { el.style.visibility='hidden'; return; }
    }
    el.style.visibility = '';
    kept.push(r);
  });
}

/* ---------- interactions ---------- */
const raycaster = new THREE.Raycaster();
const pointer = { down:false, x:0, y:0, moved:0 };
function setupInteraction(){
  const dom = renderer.domElement;
  dom.addEventListener('pointerdown', e=>{ pointer.down = true; pointer.x = e.clientX; pointer.y = e.clientY; pointer.moved = 0; });
  dom.addEventListener('pointermove', e=>{ if(pointer.down) pointer.moved = Math.max(pointer.moved, Math.hypot(e.clientX-pointer.x, e.clientY-pointer.y)); });
  dom.addEventListener('pointerup', e=>{
    if(!pointer.down) return;
    pointer.down = false;
    if(pointer.moved > 6) return;
    handlePick(e.clientX, e.clientY);
  });
}
function handlePick(cx, cy){
  const r = renderer.domElement.getBoundingClientRect();
  const ndc = new THREE.Vector2(((cx-r.left)/r.width)*2-1, -((cy-r.top)/r.height)*2+1);
  raycaster.setFromCamera(ndc, camera);
  const targets = [...pickables, ...kitMeshes, walkerPick, ...flows.map(f=>f.mesh).filter(m=>m.visible)];
  const hits = raycaster.intersectObjects(targets, false);
  for(const h of hits){
    const o = h.object;
    if(o === walkerPick && o.userData.walkerIds){
      const w = walkers[o.userData.walkerIds[h.instanceId]];
      if(w){ selectWalker(w); return; }
    }
    if(o.userData && o.userData.flowId){ const f = flowById.get(o.userData.flowId); if(f){ selectFlow(f); return; } }
    if(o.userData && o.userData.itemIds && h.instanceId != null){
      const id = o.userData.itemIds[h.instanceId];
      if(id){
        if(id.endsWith('-hall')){ selectIsland(themeById.get(id.replace('-hall',''))); }
        else { selectItem(itemById.get(id)); }
        return;
      }
    }
    if(o.userData && o.userData.islandId){
      selectIsland(themeById.get(o.userData.islandId)); return;
    }
  }
}

  renderJournal();

  document.getElementById('btnList').addEventListener('click', ()=>{

  });
  document.getElementById('btnHelp').addEventListener('click', ()=> showTour());

  document.querySelectorAll('#hud [data-toggle]').forEach(b=>{
    b.addEventListener('click', ()=> setToggle(b.dataset.toggle));
  });
  document.querySelectorAll('#hud [data-time]').forEach(b=>{
    b.addEventListener('click', ()=>{
      state.timeMin = Number(b.dataset.time);
      updateEnvironment(); markDirty();
      toast(t('跳到 ','Jumped to ')+fmtTime(state.timeMin));    });
  });
  document.getElementById('mobileTime').addEventListener('click', ()=>{
    document.getElementById('hud').classList.toggle('mobOpen');
  });

  document.querySelectorAll('.tabs button').forEach(b=>{
    b.addEventListener('click', ()=>{
      state.tab = b.dataset.tab;
      document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on', x===b));
      renderSidebar();
    });
  });
  const search = document.getElementById('search');
  search.addEventListener('input', ()=>{ state.search = search.value; renderSidebar(); markDirty(); });

  panelBody.addEventListener('click', ev=>{
    const tEl = ev.target.closest('[data-item],[data-theme],[data-flow],[data-item-next],[data-flows],[data-fly]');
    if(!tEl) return;
    if(tEl.dataset.item){ const it = itemById.get(tEl.dataset.item); if(it) selectItem(it); }
    else if(tEl.dataset.theme){ const th = themeById.get(tEl.dataset.theme); if(th) selectIsland(th); }
    else if(tEl.dataset.flow){ const f = flowById.get(tEl.dataset.flow); if(f) selectFlow(f); }
    else if(tEl.dataset.itemNext){
      const it = itemById.get(tEl.dataset.itemNext);
      if(it){ const th = themeById.get(it.themeId); const nx = th.items[(th.items.indexOf(it)+1)%th.items.length]; selectItem(nx); }
    }
    else if(tEl.dataset.flows){ state.toggles.flows = true; updateFlowsVisibility(); syncToggleButtons(); toast(t('協作線已顯示','Collaboration links on')); }
    else if(tEl.dataset.fly){ const th = themeById.get(tEl.dataset.fly); if(th) selectIsland(th); }
    if(isMobile()){ panel.classList.add('show'); }
  });

  sidebarBody.addEventListener('click', ev=>{
    const el = ev.target.closest('[data-item],[data-flow],[data-theme]');
    if(!el) return;
    if(el.dataset.item){ const it = itemById.get(el.dataset.item); if(it) selectItem(it); }
    else if(el.dataset.flow){ const f = flowById.get(el.dataset.flow); if(f) selectFlow(f); }
    else if(el.dataset.theme){ const th = themeById.get(el.dataset.theme); if(th) selectIsland(th); }
    if(isMobile()){ document.getElementById('sidebar').classList.remove('show'); }
  });

  document.getElementById('tourGo').addEventListener('click', hideTour);

  addEventListener('keydown', e=>{
    if(e.key === 'Escape'){ clearSelection(); document.getElementById('sidebar').classList.remove('show'); return; }
    if(e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'ArrowUp' || e.key === 'ArrowDown'){
      const off = camera.position.clone().sub(controls.target);
      if(e.key==='ArrowLeft' || e.key==='ArrowRight'){
        off.applyAxisAngle(UP, e.key==='ArrowLeft'? -0.12 : 0.12);
      } else {
        const ang = Math.atan2(off.z, off.x);
        const rad = Math.hypot(off.x,off.z);
        const nz = clamp(rad + (e.key==='ArrowUp'? -1.2: 1.2), 4, 60);
        off.x = Math.cos(ang)*nz; off.z = Math.sin(ang)*nz;
      }
      camera.position.copy(controls.target).add(off);
      controls.update(); markDirty();
      e.preventDefault();
    }
  });

  syncToggleButtons();
  addClockPill();
}

function addClockPill(){
  const grp = document.querySelector('#hud .timeGrp');
  if(!grp || document.getElementById('clockNow')) return;
  const d = document.createElement('div');
  d.id = 'clockNow';
  d.style.cssText = 'display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 9px 0 5px;font-family:var(--mono);font-size:12px;font-weight:700;line-height:1.2;letter-spacing:.5px';
  grp.prepend(d);
}
function updateClockPill(){
  const d = document.getElementById('clockNow');
  if(!d) return;
  const slot = currentDaySlot();
  d.innerHTML = `${fmtTime(state.timeMin)}<span style="font-size:8px;letter-spacing:1.4px;color:#9a8878;font-weight:700">&nbsp;${t(slot.zh,slot.en)}</span>`;
}

let toastTimer = null;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> el.classList.remove('show'), 2000);
}

function showTour(){
  document.getElementById('tour').classList.add('show');
}
function hideTour(){
  document.getElementById('tour').classList.remove('show');
  try{ localStorage.setItem('policyIslandTourV1','1'); }catch(err){}
}
function maybeTour(){
  let seen = false;
  try{ seen = localStorage.getItem('policyIslandTourV1')==='1'; }catch(err){}
  if(!seen) setTimeout(showTour, 700);
}

function setupResize(){
  const stage = document.getElementById('stage');
  const ro = new ResizeObserver(()=>{
    const w = stage.clientWidth || innerWidth, h = stage.clientHeight || innerHeight;
    camera.aspect = w/h; camera.updateProjectionMatrix();
    renderer.setPixelRatio(Math.min(devicePixelRatio||1, isMobile()?1.4:1.75));
    renderer.setSize(w,h);
    labelRenderer.setSize(w,h);
    markDirty();
  });
  ro.observe(stage);
  addEventListener('resize', ()=>{ markDirty(); });
}
function setupReducedMotion(){
  const mq = matchMedia('(prefers-reduced-motion: reduce)');
  const apply = ()=>{
    state.reduced = mq.matches;
    if(state.reduced){
      document.querySelectorAll('.pin, .islLabel, .bubble').forEach(el=> el.style.transition='none');
    }
    markDirty();
  };
  apply();
  if(mq.addEventListener) mq.addEventListener('change', apply);
  else if(mq.addListener) mq.addListener(apply);
}
/* =========================================================
   LOOP
   ========================================================= */
function animate(now){
  requestAnimationFrame(animate);
  const dtRaw = clockObj.getDelta();
  const dt = Math.min(dtRaw, .08);
  let dirty = needsRender;

  if(!state.paused && !state.reduced){
    state.timeMin = (state.timeMin + dt*10) % 1440;
    state.animTime += dt;
    updateWalkers(dt);
    cloudGroup.forEach(g=>{
      g.position.x += g.userData.speed * dt;
      if(g.position.x > 82) g.position.x = -82;
    });
    flows.forEach(f=>{ f.material.uniforms.uTime.value = state.animTime; });
    if(++frameNo % 7 === 0) updateClockPill();
    dirty = true;
  }

  if(state.flying){
    const f = state.flying;
    const k = clamp((now - f.t0)/f.dur, 0, 1);
    const e = easeInOutCubic(k);
    camera.position.lerpVectors(f.p0, f.p1, e);
    controls.target.lerpVectors(f.t0v, f.t1v, e);
    if(k >= 1) state.flying = null;
    dirty = true;
  }

  controls.update();

  if(dirty){
    updateEnvironment();
    applyWalkerMatrices();
    const camDist = camera.position.distanceTo(controls.target);
    smallMeshes.forEach(m=>{ m.visible = camDist < 26 && !state.bird; });
    islands.forEach(isl=>{ isl.label.visible = !state.bird; });
    if(pinObjs.length) pinObjs.forEach(p=>{ p.visible = camDist < 34; });
    if(pinLine) pinLine.visible = camDist < 34;
    if(++labelTick % 8 === 0) layoutLabels();
    renderJournal();
    renderer.render(scene, camera);
    labelRenderer.render(scene, camera);
    needsRender = false;
  } else {
    renderJournal();
  }
}

/* =========================================================
   BOOT
   ========================================================= */
function boot(){
  try{
    const brandSpan = document.querySelector('#brand h1 span[data-en]');
    if(brandSpan){ brandSpan.dataset.zh = DATA.city.zh; brandSpan.dataset.en = DATA.city.en; }
    applyStaticLang();
    initRenderer();
    buildSky();
    buildWater();
    buildLights();
    buildTerrain();
    buildBackgroundTrees();
    buildRidges();
    buildClouds();
    buildSeaProps();
    buildIslands();
    buildBuildings();
    buildWalkGraph();
    buildFlows();
    kitMeshes = makeKitMeshes(kitEntries, false);
    smallMeshes = makeKitMeshes(smallEntries, true);
    buildLightPools();
    buildWalkers();
    setupUI();
    setupInteraction();
    setupResize();
    setupReducedMotion();
    goOverview(true);
    updateEnvironment();
    updateFlowsVisibility();
    refreshColors();
    applyWalkerMatrices();
    updateClockPill();
    renderSidebar();
    renderer.render(scene, camera);
    labelRenderer.render(scene, camera);
    window.__islandBoot = true;
    window.__island = { scene, camera, controls, flows, walkers, islands, state, kitMeshes, smallMeshes, renderer };
    const loader = document.getElementById('loader');
    loader.classList.add('done');
    setTimeout(()=>{ loader.style.display = 'none'; }, 650);
    maybeTour();
    animate(performance.now());
  } catch(err){
    console.error(err);
    showLoadError(t('初始化失敗：','Init failed: ') + (err && err.message ? err.message : err));
  }
}
boot();
</script>
